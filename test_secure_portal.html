<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Secure Exam Portal</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background-color: #f8fafc; }
        .exam-box { background: white; padding: 20px; border: 2px solid #ef4444; border-radius: 8px; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .warning { color: #ef4444; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="exam-box">
        <h2 style="margin-top: 0;">Question 1</h2>
        <p class="warning">⚠️ This is a secure portal. Copy and Paste functionalities have been strictly disabled.</p>
        
        <p id="question-text">
            <strong>Explain the architectural differences between an embedded Chromium WebView and a standard Google Chrome instance in terms of anti-bot fingerprinting.</strong>
        </p>

        <textarea rows="4" style="width: 100%; margin-top: 10px;" placeholder="Type your answer here..."></textarea>
    </div>

    <script>
        // Aggressively block Copy events
        document.addEventListener('copy', function(e) {
            e.preventDefault();
            alert('SECURITY ALERT: Copying text is strictly prohibited on this exam portal!');
        });

        // Aggressively block Ctrl+C keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
                alert('SECURITY ALERT: Ctrl+C is disabled!');
            }
        });

        // Block Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
